body{margin:0}
a{color:inherit}
@keyframes ts-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}

.ts-bob,.ts-sway,.ts-hop,.ts-drift,.ts-tw{transform-box:fill-box;transform-origin:50% 100%}

.ts-bob{animation:ts-bob 2.6s ease-in-out infinite}
.ts-sway{animation:ts-sway 3.2s ease-in-out infinite}

.ts-drift{animation:ts-drift 5s ease-in-out infinite}
.ts-tw{animation:ts-tw 2.4s ease-in-out infinite}
.d1{animation-delay:-0.7s}.d2{animation-delay:-1.4s}.d3{animation-delay:-2.1s}
.ts-btn{transition:transform .12s ease, box-shadow .12s ease}
.ts-btn:hover{transform:translateY(-2px)}
.ts-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2D1E2F !important}

.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#FFFFFF;box-shadow:0 0 0 2px #2D1E2F;transition:left .2s}
.sw:checked{background:#3D6AE0;box-shadow:inset 0 0 0 2px #2D1E2F}

.rc + span{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;box-sizing:border-box;border-radius:22px;border:2px solid #2D1E2F;background:#FBF8F2;font-weight:800;font-size:14px;cursor:pointer}
.rc:checked + span{background:#FFD84D;color:#2D1E2F;box-shadow:0 3px 0 #2D1E2F;transform:translateY(-2px)}
button{font-family:inherit}
</style>
