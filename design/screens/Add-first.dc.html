    let pickedLabel = '';
    const sections = [];
    cats.forEach((k) => {
      if (!query && cat !== 'alles' && cat !== k.id) return;
      const items = k.items
        .filter((x) => !query || x[1].toLowerCase().indexOf(query) !== -1)
        .map((x) => {
          if (x[0] === picked) pickedLabel = x[1];
          return { id: x[0], label: x[1], icon: x[2], bg: k.bg, selected: x[0] === picked, unselected: x[0] !== picked,
            pick: () => this.setState({ picked: x[0] }) };
        });
      if (items.length) sections.push({ title: k.title.toUpperCase(), bg: k.bg, count: String(items.length), items });
    });
    cats.forEach((k) => k.items.forEach((x) => { if (x[0] === picked) pickedLabel = x[1]; }));
    const chipDefs = [{ id: 'alles', label: 'Alles', bg: '#FFFFFF' }].concat(cats.map((k) => ({ id: k.id, label: k.title, bg: k.bg })));
    const chips = chipDefs.map((d) => ({ label: d.label, bg: d.bg, on: d.id === cat && !query, off: !(d.id === cat && !query),
      pick: () => this.setState({ cat: d.id, q: '' }) }));
    return {
      q, chips, sections,
      noResults: sections.length === 0,
      setQ: (e) => this.setState({ q: e.target.value }),
      hasPick: !!picked, noPick: !picked,
      pickedLabel: pickedLabel.toLowerCase()
    };
  }
}
</script>
</body>
