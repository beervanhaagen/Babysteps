name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tokens are up to date with tokens.json
        run: npm run tokens && git diff --exit-code packages/ui/src/tokens.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Family page has no analytics, crash reporting or Google fonts
        run: npm run family:export && npm run check:web-bundle
