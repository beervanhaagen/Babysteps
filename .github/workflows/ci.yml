name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tokens and art are up to date with the design system
        run: npm run tokens && npm run art && git diff --exit-code packages/ui/src/tokens.ts packages/ui/src/art.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Family page has no analytics, crash reporting or Google fonts
        run: npm run family:export && npm run check:web-bundle

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only what the tests need: the database, auth (for auth.users), storage and the API.
      - run: npx supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - name: Privacy tests (RLS on every table, no names kept, parents see only their own trail)
        run: npx supabase test db
