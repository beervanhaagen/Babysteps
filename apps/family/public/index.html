    <!-- The react-native-web style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,

        height: 100%;

        overflow: hidden;
        background-color: #F2ECE1;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
