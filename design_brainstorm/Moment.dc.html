<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BabySteps follower view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6EEDF; color: #1F2A44; font-family: 'Nunito Sans', system-ui, sans-serif">

<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 96px; overflow-y: auto; box-sizing: border-box; padding: 28px 20px 24px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #3E5A45">Following as Oma</div>
<h1 style="margin: 4px 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 1.1">Lotte's expedition</h1>
<div style="font-size: 15px; line-height: 1.4; color: #59627A">Front-row seat. Zero packing required.</div>

<div style="margin-top: 16px; box-sizing: border-box; padding: 14px 16px; border-radius: 20px; background: #FFFAF1; border: 1px solid #EADFCB; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 18px">Now crossing Rolling Hills</div>
<div style="font-size: 13px; color: #59627A">Week 23</div>
</div>
<div style="display: flex; align-items: center">
<div style="width: 14px; height: 14px; border-radius: 7px; background: #6E8B6F"></div>
<div style="flex: 1; height: 3px; background: #6E8B6F"></div>
<div style="width: 14px; height: 14px; border-radius: 7px; background: #6E8B6F"></div>
<div style="flex: 1; height: 3px; background: #6E8B6F"></div>
<div style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; background: #F0A468; border: 4px solid #FFFFFF"></div>
<div style="flex: 1; height: 3px; background: #D5CBB8"></div>
<div style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 7px; border: 3px solid #59627A"></div>
<div style="flex: 1; height: 3px; background: #D5CBB8"></div>
<div style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 7px; border: 3px solid #59627A"></div>
</div>
</div>

<h2 style="margin: 22px 0 10px; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 20px">New postcards</h2>
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<div style="box-sizing: border-box; padding: 12px; border-radius: 22px; background: #FFFAF1; border: 1px solid #EADFCB; display: flex; flex-direction: column; gap: 10px">
<div style="height: 130px; border-radius: 16px; background: {{c.tint}}"></div>
<div style="font-size: 12px; font-weight: 700; color: #59627A">{{c.week}}</div>
<div style="font-size: 16px; font-weight: 700; line-height: 1.3">{{c.text}}</div>
<button onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}; font-size: 15px; font-weight: 700">
<svg width="18" height="18" viewBox="0 0 24 24" fill="{{c.heartFill}}" stroke="{{c.heartStroke}}" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-4.6-9.2-9A5.2 5.2 0 0 1 12 6.5 5.2 5.2 0 0 1 21.2 12C19 16.4 12 21 12 21z"/></svg>
<span>{{c.label}}</span>
</button>
</div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; box-sizing: border-box; padding: 14px 20px 0; background: #FFFAF1; border-top: 1px solid #EADFCB">
<button onClick="{{voice}}" style="width: 100%; height: 56px; border: 0; border-radius: 28px; background: {{voiceBg}}; color: {{voiceInk}}; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{voiceInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
<span>{{voiceLabel}}</span>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      hearted: { a: false, b: true, c: false },
      voice: 'idle',
      secs: 0
    };
  }

  componentWillUnmount() {
    clearInterval(this._iv);
  }

  toggleHeart(key) {
    const h = Object.assign({}, this.state.hearted);
    h[key] = !h[key];
    this.setState({ hearted: h });
  }

  voiceTap() {
    const v = this.state.voice;
    if (v === 'idle' || v === 'sent') {
      clearInterval(this._iv);
      this.setState({ voice: 'rec', secs: 0 });
      this._iv = setInterval(() => this.setState({ secs: this.state.secs + 1 }), 1000);
    } else {
      clearInterval(this._iv);
      this.setState({ voice: 'sent' });
    }
  }

  renderVals() {
    const s = this.state;
    const base = [
      { key: 'a', week: 'Week 23', text: 'Wobbly sit, two whole seconds. Nobody breathed.', tint: '#F0C79E', n: 8 },
      { key: 'b', week: 'Week 22', text: 'Bath-time splash. The dog is now also bathed.', tint: '#BBD5DC', n: 12 },
      { key: 'c', week: 'Week 21', text: 'Discovered feet. Best day ever.', tint: '#BFD4AE', n: 7 }
    ];
    const cards = base.map((b) => {
      const on = s.hearted[b.key];
      return {
        week: b.week,
        text: b.text,
        tint: b.tint,
        pressed: on ? 'true' : 'false',
        label: on ? (b.n + 1) + ' hearts · sent' : 'Send a heart · ' + b.n,
        bg: on ? '#1F2A44' : 'transparent',
        ink: on ? '#F6EEDF' : '#1F2A44',
        border: on ? '#1F2A44' : '#D5CBB8',
        heartFill: on ? '#F0A468' : 'none',
        heartStroke: on ? '#F0A468' : '#1F2A44',
        toggle: () => this.toggleHeart(b.key)
      };
    });
    const mm = String(Math.floor(s.secs / 60));
    const ss = String(s.secs % 60).padStart(2, '0');
    let voiceLabel = 'Hold the phone, say hi to Lotte';
    let voiceBg = '#1F2A44';
    let voiceInk = '#F6EEDF';
    if (s.voice === 'rec') {
      voiceLabel = 'Recording ' + mm + ':' + ss + ' · tap to send';
      voiceBg = '#F0A468';
      voiceInk = '#1F2A44';
    } else if (s.voice === 'sent') {
      voiceLabel = 'Sent. Record another?';
      voiceBg = '#6E8B6F';
      voiceInk = '#FFFFFF';
    }
    return {
      cards: cards,
      voiceLabel: voiceLabel,
      voiceBg: voiceBg,
      voiceInk: voiceInk,
      voice: () => this.voiceTap()
    };
  }
}
</script>
</body>
</html>
